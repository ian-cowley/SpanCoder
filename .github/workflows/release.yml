name: Build, Test, and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_name: spancoder-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_name: spancoder-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_name: spancoder-osx-x64.tar.gz

    steps:
      - name: Checkout SpanCoder
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup NuGet sources
        shell: bash
        run: |
          dotnet nuget remove source github-packages 2>/dev/null || true
          dotnet nuget add source "https://nuget.pkg.github.com/ian-cowley/index.json" \
            --name "github-packages" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore SpanCoder.slnx

      - name: Build Release
        run: dotnet build SpanCoder.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test src/SpanCoder.Tests/SpanCoder.Tests.csproj -c Release --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s

      - name: Install Native AOT Dependencies (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish SpanCoder App & Engine
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish src/SpanCoder.App/SpanCoder.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/
          dotnet publish src/SpanCoder.Engine/SpanCoder.Engine.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/
          dotnet publish src/SpanCoder.Extensions.Prettier/SpanCoder.Extensions.Prettier.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/plugins/prettier-extension/
          dotnet publish src/SpanCoder.Extensions.HtmlPreview/SpanCoder.Extensions.HtmlPreview.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/plugins/html-preview/
          dotnet publish src/SpanCoder.Extensions.Languages/SpanCoder.Extensions.Languages.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/plugins/languages-extension/

      - name: Package Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Release (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os != 'windows-latest'
        run: tar -czvf ${{ matrix.archive_name }} -C publish .

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-build
          path: ${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: win-x64-build
          path: ./

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-build
          path: ./

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: osx-x64-build
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spancoder-win-x64.zip
            spancoder-linux-x64.tar.gz
            spancoder-osx-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
